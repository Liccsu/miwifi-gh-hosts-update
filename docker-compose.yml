services:
  miwifi-gh-hosts-update:
    image: ghcr.io/liccsu/miwifi-gh-hosts-update:latest
    container_name: miwifi-gh-hosts-update
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    ports:
      # WebUI: 状态查看与授权操作
      - "8571:8571"
    volumes:
      # token 缓存 (授权后持久化, 避免重复授权) 与授权文件通道
      - ./data:/data
